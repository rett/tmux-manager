# tmux-manager session config. One file per session in ~/.tmux-manager/.
# Lines are KEY=VALUE; values are literal to end of line (no quotes needed).
# Only full-line comments are supported.

SESSION_NAME=dev
START_DIR=~/projects
ENABLED=true

# WINDOW=name:command  (command optional; omit the colon for a plain shell)
WINDOW=edit:vim .
WINDOW=serve:python3 -m http.server 8080
WINDOW=shell

# Raw tmux commands run after the session is created
POST_CMD=split-window -h -t =dev:shell -c ~/projects
POST_CMD=select-window -t =dev:edit
